<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151514">
    <meta name="robots" content="noindex,nofollow">
    <title>You're offline · Architecture Portfolio</title>
    <style>
        :root{color-scheme:dark;--page:#151514;--card:#20201e;--text:#efeee9;--muted:#aaa9a1;--line:#393936;--accent:#b4c0a8;--notice:#332b20;--notice-text:#e4c895;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--page);font-synthesis:none;text-rendering:optimizeLegibility}html[data-theme="light"]{color-scheme:light;--page:#f4f3ef;--card:#fff;--text:#20211e;--muted:#686a63;--line:#d8d8cf;--accent:#384236;--notice:#f5e9d4;--notice-text:#75480f}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:var(--page)}.card{width:min(100%,520px);padding:clamp(26px,7vw,44px);border:1px solid var(--line);border-radius:20px;background:var(--card);text-align:center;box-shadow:0 20px 64px #0003}.signal{display:grid;width:72px;height:72px;place-items:center;margin:0 auto 22px;border-radius:50%;background:var(--notice);color:var(--notice-text)}.signal svg{width:34px;height:34px}.status{display:inline-flex;align-items:center;gap:8px;margin:0;padding:8px 12px;border-radius:999px;background:var(--notice);color:var(--notice-text);font-size:.82rem;font-weight:750}.status::before{width:8px;height:8px;border-radius:50%;background:#bd781f;content:""}h1{margin:18px 0 10px;color:var(--text);font-size:clamp(1.7rem,7vw,2.35rem);line-height:1.2;letter-spacing:-.035em}p{margin:0;color:var(--muted);line-height:1.8}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}.button{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:11px 18px;border:1px solid var(--accent);border-radius:999px;background:var(--accent);color:var(--page);text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.button.secondary{background:transparent;color:var(--text);border-color:var(--line)}.hint{margin-top:22px;font-size:.82rem}[dir="rtl"] body{font-family:system-ui,"Segoe UI",sans-serif}@media(max-width:420px){body{padding:14px}.card{border-radius:16px}.actions{display:grid}.button{width:100%}}
    </style>
</head>
<body>
    <main class="card" aria-labelledby="offline-title">
        <div class="signal" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M5 11.5a17 17 0 0 1 22 0M9 16a11 11 0 0 1 14 0m-10 4.5a5 5 0 0 1 6 0M16 25h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="m5 5 22 22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </div>
        <p class="status" id="connection-status" role="status" aria-live="polite" data-state="offline" data-en="Offline mode · site unavailable" data-ar="وضع عدم الاتصال · الموقع غير متاح">Offline mode · site unavailable</p>
        <h1 id="offline-title" data-en="No internet connection" data-ar="لا يوجد اتصال بالإنترنت">No internet connection</h1>
        <p data-en="The site couldn't be reached. Check your internet connection, then try again. Previously opened portfolio pages may still be available." data-ar="تعذر الاتصال بالموقع. تحقق من اتصال الإنترنت ثم حاول مرة أخرى. قد تظل الصفحات التي فتحتها سابقًا متاحة.">The site couldn't be reached. Check your internet connection, then try again. Previously opened portfolio pages may still be available.</p>
        <div class="actions">
            <button class="button" id="retry-button" type="button" data-en="Try again" data-ar="حاول مرة أخرى">Try again</button>
            <a class="button secondary" href="/" data-en="Open home page" data-ar="افتح الصفحة الرئيسية">Open home page</a>
        </div>
        <p class="hint" data-en="Your changes haven't been saved. Reconnect before sending forms or uploading images." data-ar="لم يتم حفظ أي تغييرات. أعد الاتصال بالإنترنت قبل إرسال النماذج أو رفع الصور.">Your changes haven't been saved. Reconnect before sending forms or uploading images.</p>
    </main>
    <script>
        (() => {
            const status = document.getElementById('connection-status');
            const language = (() => { try { return localStorage.getItem('site_lang') === 'ar' ? 'ar' : 'en'; } catch { return 'en'; } })();
            const theme = (() => { try { return localStorage.getItem('site_theme') === 'light' ? 'light' : 'dark'; } catch { return 'dark'; } })();
            document.documentElement.lang = language;
            document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.dataset.theme = theme;
            document.querySelectorAll('[data-en][data-ar]').forEach(element => { element.textContent = element.dataset[language]; });

            const updateConnection = () => {
                const connected = navigator.onLine;
                status.dataset.state = 'offline';
                status.textContent = connected
                    ? (language === 'ar' ? 'الشبكة متاحة، لكن الموقع لم يستجب بعد' : 'Network detected, but the site has not responded')
                    : status.dataset[language];
            };

            document.getElementById('retry-button').addEventListener('click', () => window.location.reload());
            window.addEventListener('online', updateConnection);
            window.addEventListener('offline', updateConnection);
            updateConnection();
        })();
    </script>
</body>
</html>
